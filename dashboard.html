<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FluxGuard Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
    }

    header span {
      font-size: 0.85rem;
      background: #1e2736;
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid #2d3f5a;
    }

    .meta {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    .meta b { color: #94a3b8; }

    #empty {
      color: #475569;
      font-size: 0.95rem;
      padding: 40px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead tr {
      background: #1e2736;
      text-align: left;
    }

    thead th {
      padding: 12px 16px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.04em;
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    tbody tr {
      border-bottom: 1px solid #1e2736;
      transition: background 0.15s;
    }

    tbody tr:hover { background: #161c27; }

    tbody td { padding: 12px 16px; }

    .ip { font-family: monospace; color: #e2e8f0; }

    .bar-wrap {
      background: #1e2736;
      border-radius: 4px;
      height: 8px;
      width: 160px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .safe  { background: #22c55e; }
    .warn  { background: #f59e0b; }
    .danger{ background: #ef4444; }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-ok     { background: #14532d; color: #4ade80; }
    .badge-warn   { background: #451a03; color: #fbbf24; }
    .badge-danger { background: #450a0a; color: #f87171; }

    button.reset-btn {
      background: #1e2736;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    button.reset-btn:hover {
      background: #2d3f5a;
      color: #e2e8f0;
    }

    footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #334155;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ FluxGuard</h1>
    <span>Rate Limiter · Live</span>
  </header>

  <div class="meta">
    Window: <b>60s</b> &nbsp;|&nbsp; Limit: <b>10 req / IP</b> &nbsp;|&nbsp;
    Auto-refresh: <b>every 3s</b>
  </div>

  <div id="empty">No traffic yet. Hit <code>/api/search</code> or <code>/api/data</code> to see IPs appear.</div>
  <table id="table" style="display:none">
    <thead>
      <tr>
        <th>IP Address</th>
        <th>Requests (last 60s)</th>
        <th>Usage</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <footer>FluxGuard · Sliding Window Algorithm · fakeredis (local)</footer>

  <script>
    async function refresh() {
      const res  = await fetch('/stats');
      const data = await res.json();
      const keys = Object.keys(data);
      const empty = document.getElementById('empty');
      const table = document.getElementById('table');
      const tbody = document.getElementById('tbody');

      if (keys.length === 0) {
        empty.style.display = 'block';
        table.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      table.style.display = 'table';
      tbody.innerHTML = '';

      keys.forEach(ip => {
        const { requests_in_window, limit, remaining } = data[ip];
        const pct   = Math.round((requests_in_window / limit) * 100);
        const color = pct >= 100 ? 'danger' : pct >= 70 ? 'warn' : 'safe';
        const badge = pct >= 100
          ? '<span class="badge badge-danger">BLOCKED</span>'
          : pct >= 70
            ? '<span class="badge badge-warn">WARNING</span>'
            : '<span class="badge badge-ok">OK</span>';

        tbody.innerHTML += `
          <tr>
            <td class="ip">${ip}</td>
            <td>${requests_in_window} / ${limit}</td>
            <td>
              <div class="bar-wrap">
                <div class="bar ${color}" style="width:${Math.min(pct,100)}%"></div>
              </div>
            </td>
            <td>${badge}</td>
            <td>
              <button class="reset-btn" onclick="resetIP('${ip}')">Reset</button>
            </td>
          </tr>`;
      });
    }

    async function resetIP(ip) {
      await fetch('/reset/' + ip, { method: 'POST' });
      refresh();
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
